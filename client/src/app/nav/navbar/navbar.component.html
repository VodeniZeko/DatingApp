<nav class="navbar navbar-expand-md fixed-top navbar-dark">
  <div class="container">
    <a class="navbar-brand" routerLink="/">Dating App</a>

    <ul class="navbar-nav me-auto mb-2 mb-lg-0">
      <ng-container *ngIf="accountService.currUser$ | async">
        <li class="nav-item">
          <a
            class="nav-link"
            routerLink="/members"
            routerLinkActive="nav-link-active"
            >Matches</a
          >
        </li>
        <li class="nav-item">
          <a
            class="nav-link"
            routerLink="/lists"
            routerLinkActive="nav-link-active"
            >List</a
          >
        </li>

        <li class="nav-item">
          <a
            class="nav-link"
            routerLink="/messages"
            routerLinkActive="nav-link-active"
            >Messages</a
          >
        </li>
      </ng-container>
    </ul>

    <div
      *ngIf="accountService.currUser$ | async as user"
      class="btn-group"
      dropdown
    >
      <button
        id="button-basic"
        dropdownToggle
        type="button"
        class="btn btn-primary dropdown-toggle"
        aria-controls="dropdown-basic"
      >
        Welcome {{ user.username | titlecase }} <span class="caret"></span>
      </button>
      <ul
        id="dropdown-basic"
        *dropdownMenu
        class="dropdown-menu"
        role="menu"
        aria-labelledby="button-basic"
      >
        <li role="menuitem">
          <a class="dropdown-item" href="#">Edit Profile</a>
        </li>
        <li class="divider dropdown-divider"></li>
        <li role="menuitem">
          <a class="dropdown-item" href="#" (click)="logout()">Logout</a>
        </li>
      </ul>
    </div>

    <form
      *ngIf="!(accountService.currUser$ | async)"
      #loginForm="ngForm"
      class="d-flex"
      (ngSubmit)="login()"
    >
      <input
        name="username"
        [(ngModel)]="model.username"
        class="form-control me-2"
        type="text"
        placeholder="username"
      />
      <input
        name="password"
        [(ngModel)]="model.password"
        class="form-control me-2"
        type="password"
        placeholder="password"
      />
      <button class="btn btn-outline-success" type="submit">Login</button>
    </form>
  </div>
</nav>
